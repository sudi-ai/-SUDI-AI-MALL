# Place these maps at http scope, before the existing mall server block.
map $http_accept $sudi_webp_suffix {
    default "";
    "~*image/webp[^,]*;[ ]*q=0([.]0+)?([ ]*,|[ ]*$)" "";
    "~*image/webp" ".sudi-v1.webp";
}
map $arg_original $sudi_image_suffix {
    default $sudi_webp_suffix;
    1 "";
}

